<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inverbot Local Server</title>
    <style>
        :root {
            --bg-main: #f4f6f8;
            --bg-card: #ffffff;
            --bg-input: #f7f9fc;
            --border-color: #cbd5e0;
            --primary-green: #00b96b;
            --text-main: #1a202c;
            --text-muted: #4a5568;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
        .app-container { width: 100%; max-width: 450px; background: var(--bg-card); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header-banner { background: linear-gradient(135deg, #00b96b, #008449); color: #fff; padding: 18px; border-radius: 10px; text-align: center; margin-bottom: 16px; }
        .header-banner h1 { font-size: 20px; font-weight: 800; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 4px; font-weight: 700; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 11px; background-color: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; font-size: 12px; outline: none; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; background: var(--primary-green); color: #fff; margin-top: 6px; }
        .auth-switch { text-align: center; margin-top: 14px; font-size: 11px; color: var(--text-muted); }
        .auth-switch a { color: var(--primary-green); cursor: pointer; text-decoration: none; font-weight: 800; }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="authScreen">
            <div class="header-banner">
                <h1>INVERBOT LOCAL</h1>
                <p>Servidor Node.js Activo</p>
            </div>

            <!-- REGISTRO -->
            <div id="registerView">
                <div class="input-group"><label>Correo</label><input type="email" id="regEmail" placeholder="trader@gmail.com"></div>
                <div class="input-group"><label>Contraseña</label><input type="password" id="regPass" placeholder="••••••••"></div>
                <button class="btn" onclick="registrarLocal()">Registrarse</button>
                <div class="auth-switch"><p>¿Ya tienes cuenta? <a onclick="cambiarVista(true)">Iniciar Sesión</a></p></div>
            </div>

            <!-- LOGIN -->
            <div id="loginView" style="display: none;">
                <div class="input-group"><label>Correo</label><input type="email" id="logEmail" placeholder="trader@gmail.com"></div>
                <div class="input-group"><label>Contraseña</label><input type="password" id="logPass" placeholder="••••••••"></div>
                <button class="btn" onclick="loginLocal()">Iniciar Sesión</button>
                <div class="auth-switch"><p>¿Nuevo? <a onclick="cambiarVista(false)">Registrarse</a></p></div>
            </div>
        </div>

        <div id="userDashboard" style="display: none; text-align: center;">
            <h2 style="color: var(--primary-green); margin-bottom: 10px;">¡Bienvenido al Panel!</h2>
            <p id="lblLogEmail" style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;"></p>
            <button class="btn" onclick="location.reload()" style="background: #e53e3e;">Cerrar Sesión</button>
        </div>
    </div>

    <script>
        function cambiarVista(isLog) {
            document.getElementById('registerView').style.display = isLog ? 'none' : 'block';
            document.getElementById('loginView').style.display = isLog ? 'block' : 'none';
        }

        async function registrarLocal() {
            let email = document.getElementById('regEmail').value.trim();
            let pass = document.getElementById('regPass').value.trim();
            if(!email || !pass) { alert("Rellene los campos"); return; }

            let res = await fetch('/api/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, pass })
            });
            let data = await res.json();
            if(data.success) {
                alert("¡Registrado con éxito!");
                cambiarVista(true);
            } else {
                alert(data.message);
            }
        }

        async function loginLocal() {
            let email = document.getElementById('logEmail').value.trim();
            let pass = document.getElementById('logPass').value.trim();
            if(!email || !pass) { alert("Rellene los campos"); return; }

            let res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, pass })
            });
            let data = await res.json();
            if(data.success) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('userDashboard').style.display = 'block';
                document.getElementById('lblLogEmail').innerText = data.user.email;
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
