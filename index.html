<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inverbot</title>
    <!-- Estilos generales y diseño visual -->
    <style>
        :root {
            --primary-color: #00ff66;
            --bg-color: #0b0f0e;
            --card-bg: #131a18;
            --text-color: #ffffff;
            --border-color: #1f2e28;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 255, 102, 0.1);
        }
        h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #0b0f0e;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
        }
        input:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        .alert-box {
            background: #ff4d4d;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            display: none;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container" id="authContainer">
        <h2>INVERBOT</h2>
        <div id="alertBox" class="alert-box"></div>

        <!-- Formulario de Inicio de Sesión -->
        <div id="loginSection">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="logEmail" placeholder="tucorreo@gmail.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="logPass" placeholder="••••••••">
            </div>
            <button onclick="ejecutarLoginFirebase()">Iniciar Sesión</button>
            <p style="text-align: center; margin-top: 15px; font-size: 14px;">
                ¿No tienes cuenta? <a href="#" onclick="toggleAuth()" style="color: var(--primary-color);">Regístrate aquí</a>
            </p>
        </div>

        <!-- Formulario de Registro -->
        <div id="registerSection" class="hidden">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="regEmail" placeholder="tucorreo@gmail.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="regPass" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Confirmar Contraseña</label>
                <input type="password" id="regPassConfirm" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Código de Referido (Opcional)</label>
                <input type="text" id="regRef" placeholder="REF-XXXXXX">
            </div>
            <button onclick="ejecutarRegistroFirebase()">Registrarse</button>
            <p style="text-align: center; margin-top: 15px; font-size: 14px;">
                ¿Ya tienes cuenta? <a href="#" onclick="toggleAuth()" style="color: var(--primary-color);">Inicia sesión</a>
            </p>
        </div>
    </div>

    <!-- Panel Dashboard (Oculto inicialmente) -->
    <div class="container hidden" id="dashboardContainer">
        <h2>Dashboard Inverbot</h2>
        <p>Bienvenido, <span id="userEmailDisplay"></span></p>
        <p>Tu código de referido: <strong id="userCodeDisplay" style="color: var(--primary-color);"></strong></p>
        <button onclick="cerrarSesion()" style="background-color: #ff4d4d; color: white;">Cerrar Sesión</button>
    </div>

    <!-- Script de Firebase y lógica de la aplicación -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuración oficial de Firebase (Proyecto: inverbot-40dd9)
        const firebaseConfig = {
            apiKey: "AIzaSyC...", // Mantén tu apiKey original si ya la tienes configurada en tu archivo
            authDomain: "inverbot-40dd9.firebaseapp.com",
            projectId: "inverbot-40dd9",
            storageBucket: "inverbot-40dd9.appspot.com",
            messagingSenderId: "TUTU",
            appId: "TUTU"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ADMIN_EMAILS = ["soporteinverbot@gmail.com"];
        let currentUser = null;
        let sessionEmail = sessionStorage.getItem("inverbot_session");

        window.addEventListener('DOMContentLoaded', () => {
            if(sessionEmail) {
                cargarSesionDirecta(sessionEmail);
            }
        });

        window.toggleAuth = function() {
            document.getElementById('loginSection').classList.toggle('hidden');
            document.getElementById('registerSection').classList.toggle('hidden');
            ocultarAlerta();
        }

        function mostrarAlertaPro(titulo, mensaje) {
            let box = document.getElementById('alertBox');
            box.innerText = `${titulo}: ${mensaje}`;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 6000);
        }

        function ocultarAlerta() {
            document.getElementById('alertBox').style.display = 'none';
        }

        // Función de seguridad (Timeout de 5 segundos) para que la app NUNCA se quede congelada
        async function conTimeout(promise, segundos = 5) {
            let timeout = new Promise((_, reject) => 
                setTimeout(() => reject(new Error("Tiempo de espera agotado.")), segundos * 1000)
            );
            return Promise.race([promise, timeout]);
        }

        async function ejecutarRegistroFirebase() {
            try {
                let email = document.getElementById('regEmail').value.trim().toLowerCase();
                let pass = document.getElementById('regPass').value.trim();
                let passConfirm = document.getElementById('regPassConfirm').value.trim();
                let refCode = document.getElementById('regRef').value.trim();

                if(!email || !pass) { mostrarAlertaPro("Error", "Rellene todos los campos obligatorios."); return; }
                if(pass !== passConfirm) { mostrarAlertaPro("Error", "Las contraseñas no coinciden."); return; }

                let docRef = doc(db, "users", email);
                let docSnap = await conTimeout(getDoc(docRef), 5);
                if(docSnap.exists()) {
                    mostrarAlertaPro("Aviso", "Este correo ya está registrado en Firebase.");
                    return;
                }

                let myCode = "REF-" + Math.floor(100000 + Math.random() * 900000);
                currentUser = { 
                    email: email, pass: pass, balance: 0.0, code: myCode, 
                    refBy: null, refCount: 0, validRefCount: 0, teamDepositTotal: 0, 
                    commissionTotal: 0, vipActive: null, vipExpiry: 0, lastClaim: 0, 
                    isAdmin: ADMIN_EMAILS.map(em=>em.toLowerCase()).includes(email) || email === "soporteinverbot@gmail.com"
                };

                if(refCode) {
                    let querySnapshot = await conTimeout(getDocs(collection(db, "users")), 5);
                    querySnapshot.forEach(d => {
                        let uData = d.data();
                        if(uData.code && uData.code.toUpperCase() === refCode.toUpperCase()) {
                            currentUser.refBy = uData.email;
                            updateDoc(doc(db, "users", uData.email), { refCount: (uData.refCount || 0) + 1 });
                        }
                    });
                }

                await conTimeout(setDoc(docRef, currentUser), 5);

                sessionEmail = email;
                sessionStorage.setItem("inverbot_session", sessionEmail);
                entrarDashboardDirecto();
            } catch (e) {
                console.error("Error en registro:", e);
                mostrarAlertaPro("Error de Conexión", "No se pudo conectar con Firebase. Revisa tu red o la conexión.");
            }
        }
        window.ejecutarRegistroFirebase = ejecutarRegistroFirebase;

        async function ejecutarLoginFirebase() {
            try {
                let email = document.getElementById('logEmail').value.trim().toLowerCase();
                let pass = document.getElementById('logPass').value.trim();
                
                if(!email || !pass) { mostrarAlertaPro("Error", "Ingrese correo y contraseña."); return; }

                let docRef = doc(db, "users", email);
                let docSnap = await conTimeout(getDoc(docRef), 5);
                if(!docSnap.exists()) {
                    mostrarAlertaPro("Error", "El usuario no existe en Firebase.");
                    return;
                }
                let u = docSnap.data();
                if(u.pass !== pass) {
                    mostrarAlertaPro("Error", "Contraseña incorrecta.");
                    return;
                }

                currentUser = u;
                sessionEmail = u.email;
                sessionStorage.setItem("inverbot_session", sessionEmail);
                entrarDashboardDirecto();
            } catch (e) {
                console.error("Error en login:", e);
                mostrarAlertaPro("Error de Conexión", "No se pudo conectar con Firebase. Revisa tu red o la conexión.");
            }
        }
        window.ejecutarLoginFirebase = ejecutarLoginFirebase;

        async function cargarSesionDirecta(email) {
            try {
                let docRef = doc(db, "users", email);
                let docSnap = await conTimeout(getDoc(docRef), 5);
                if(docSnap.exists()) {
                    currentUser = docSnap.data();
                    entrarDashboardDirecto();
                }
            } catch (e) {
                console.log("No se pudo cargar sesión guardada automáticamente.");
            }
        }

        function entrarDashboardDirecto() {
            document.getElementById('authContainer').classList.add('hidden');
            document.getElementById('dashboardContainer').classList.remove('hidden');
            document.getElementById('userEmailDisplay').innerText = currentUser.email;
            document.getElementById('userCodeDisplay').innerText = currentUser.code;
        }

        window.cerrarSesion = function() {
            sessionStorage.removeItem("inverbot_session");
            location.reload();
        }
    </script>
</body>
</html>
